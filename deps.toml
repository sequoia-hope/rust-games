# The crate dependency rules of the whole workspace, enforced by
# `cargo xtask check-deps` (crates/engine/pk_xtask/src/deps.rs explains the
# fields). Every workspace member needs an entry, so a new crate cannot slip
# in unchecked.
#
# The shared crates under crates/ may depend only on each other: a library
# that reached into a game would break every other consumer of it.

[banned]
# No engine, no browser, no ambient randomness, no threads.
sim = ["bevy*", "wgpu*", "web-sys", "js-sys", "wasm-bindgen*", "rand*", "getrandom", "rayon*", "crossbeam*"]
# World generation: no engine, no GPU; rayon only behind a non-default
# feature, so it must be absent from the default tree.
world = ["bevy*", "wgpu*", "rayon*"]
no_engine = ["bevy*", "wgpu*"]
no_bevy = ["bevy*"]

# ---------------------------------------------------------------------------
# crates/engine: Playground Kit. Layer 0 (pk_math, pk_lockstep, pk_canvas)
# has no engine, browser, ambient randomness or threads: it builds for native
# and wasm alike and the simulation on it is deterministic by construction.

# The math kernel: libm with ECMAScript semantics, the rng, the noise.
[crates.pk_math]
allowed = []
banned = "sim"
pure = true
exact_math = true

# The lockstep simulation traits and helpers (recording, hashing, fuzz).
[crates.pk_lockstep]
allowed = ["pk_math"]
banned = "sim"
pure = true
exact_math = true

# Canvas 2D on tiny-skia with runtime fonts.
[crates.pk_canvas]
allowed = ["pk_math"]
banned = "world"

# The build tooling behind a game's `cargo xtask`.
[crates.pk_xtask]
allowed = []
banned = "no_bevy"

# The Bevy client shell (layer 1): anything in layer 0.
[crates.pk_shell]
allowed = ["pk_math", "pk_lockstep", "pk_canvas"]
banned = []

[crates.engine_xtask]
allowed = ["pk_xtask"]
banned = []

# ---------------------------------------------------------------------------
# crates/music: the music engine.

# The Music Lab's port: no dependencies at all (it also builds as the
# radio's standalone worklet wasm); the game's generated music.
[crates.music]
allowed = []
banned = "sim"

# ---------------------------------------------------------------------------
# games/midnight-playground (its SPEC 3.2). The kit's crates are named
# where used: they are workspace members now, not outside path dependencies.

# The simulation crates: `#![forbid(unsafe_code)]`, no clock, threads or
# hash maps, every inexact float function through pk_math's kernel
# (SPEC 3.2, 4.2, 5.4).
[crates.mp_track]
allowed = ["pk_math"]
banned = "sim"
pure = true
exact_math = true

[crates.mp_levels]
allowed = ["mp_track", "pk_math"]
banned = "sim"
pure = true
exact_math = true

# Vehicle dynamics (docs/vehicle-dynamics/SPEC.md 2): pk_math only; it
# knows nothing of tracks, and mp_sim adapts the track to its Ground.
[crates.mp_vdyn]
allowed = ["pk_math"]
banned = "sim"
pure = true
exact_math = true

[crates.mp_sim]
allowed = ["mp_track", "mp_levels", "mp_vdyn", "pk_math"]
banned = "sim"
pure = true
exact_math = true

# The atlas (docs/vision/atlas.md): real geography and the open world's
# plan. No workspace dependencies; world generation will read real ground
# from it.
[crates.mp_atlas]
allowed = []
banned = "sim"
pure = true
exact_math = true

[crates.mp_scene]
allowed = []
banned = "no_engine"

[crates.mp_worldgen]
allowed = ["mp_scene", "mp_track", "mp_levels", "pk_math", "pk_canvas"]
banned = "world"
exact_math = true

# The exhaust engine model: no dependencies at all, so it also builds as
# the small standalone wasm the web's AudioWorklet runs.
[crates.mp_exhaust]
allowed = []
banned = "sim"

# The open world's section builder: mp_worldgen and what it builds on, as
# the worker's standalone wasm (D1215).
[crates.mp_builder]
allowed = ["mp_track", "mp_levels", "mp_scene", "mp_worldgen"]
banned = "world"

[crates.mp_audio]
allowed = ["mp_exhaust", "music", "pk_math"]
banned = "no_bevy"

[crates.mp_net]
allowed = ["mp_track", "mp_levels", "mp_sim", "pk_math"]
banned = "no_bevy"

[crates.mp_host]
allowed = ["mp_track", "mp_levels", "mp_sim", "mp_net"]
banned = "no_bevy"

[crates.mp_game]
allowed = ["mp_track", "mp_levels", "mp_sim", "mp_net", "mp_scene", "mp_worldgen", "mp_audio", "music", "pk_math", "pk_canvas", "pk_shell"]
banned = []

# The kernel's wasm build for the JS oracle (WP 0.3): pk_math only.
[crates.mr_kernel]
allowed = ["pk_math"]
banned = "sim"
exact_math = true

[crates.mp_xtask]
allowed = ["*"]
banned = []

# ---------------------------------------------------------------------------
# games/snowboarding.

# The simulation: engine-free (the workspace shape it borrowed from
# Midnight Playground).
[crates.sb_sim]
allowed = []
banned = "no_engine"

# The announcers: what they say and when, over the simulation's events.
[crates.sb_radio]
allowed = ["sb_sim"]
banned = "no_engine"

[crates.sb_game]
allowed = ["sb_sim", "sb_radio", "music"]
banned = []

[crates.sb_xtask]
allowed = []
banned = "no_bevy"

# ---------------------------------------------------------------------------
# games/mech-works: Mech Works.

# The simulation: the mech, its actuators, the Rapier world, the training
# environment. No engine: it runs in the trainer (through mw_sim_py) and
# in the client alike.
[crates.mw_sim]
allowed = []
banned = "no_engine"

# The simulation as a Python module for training (PyO3, rayon).
[crates.mw_sim_py]
allowed = ["mw_sim"]
banned = "no_engine"

# Policy inference from the trained weight blobs.
[crates.mw_policy]
allowed = []
banned = "no_engine"

# Simulation-driven sound effects (games/mech-works/docs/AUDIO.md): no
# dependencies at all, so it also builds as a standalone AudioWorklet wasm.
[crates.mw_audio]
allowed = []
banned = "sim"

# The tech demos and training viewer (Bevy client).
[crates.mw_demo]
allowed = ["mw_sim", "mw_policy", "mw_audio", "music", "pk_shell"]
banned = []

[crates.mw_xtask]
allowed = ["pk_xtask"]
banned = "no_bevy"
