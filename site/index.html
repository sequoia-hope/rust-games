<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rust-games</title>
<meta name="description" content="Games in Rust and Bevy that run in the browser, on a desktop or a phone.">
<style>
  :root { color-scheme: dark; --bg: #07080f; --card: #12141f; --line: #262a3d; --text: #e6e8f2; --dim: #9aa0b8; --accent: #ff3860; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
  h1 { margin: 0 0 .25rem; font-size: 2rem; }
  p.lede { margin: 0 0 2rem; color: var(--dim); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
  a.game { display: block; padding: 1.1rem 1.25rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); }
  a.game strong { display: block; font-size: 1.2rem; }
  a.game span { color: var(--dim); }
  li.tools { display: flex; flex-wrap: wrap; gap: .75rem; }
  a.tool { flex: 1 1 12rem; padding: .6rem 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--dim); text-decoration: none; text-align: center; font-size: .95rem; }
  a.tool:hover, a.tool:focus-visible { border-color: var(--accent); color: var(--text); }
  footer { margin-top: 2.5rem; color: var(--dim); font-size: .9rem; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
<h1>rust-games</h1>
<p class="lede">Games in Rust and Bevy that run in the browser, on a desktop or a phone. Nothing to install.</p>
<ul>
<!-- GAMES: written by scripts/pages.py from site/games.toml -->
</ul>
<footer>Source: <a href="https://github.com/sequoia-hope/rust-games">github.com/sequoia-hope/rust-games</a></footer>
</main>
</body>
</html>
