[package]
name = "pk_xtask"
description = "Build, size, profiling, dependency-rule and image-diff tooling behind a game's `cargo xtask`"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/sequoia-hope/playground-kit"
publish.workspace = true

[dependencies]
brotli = "8"
flate2 = "1"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
