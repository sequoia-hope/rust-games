[package]
name = "pk_math"
description = "Deterministic scalar math for lockstep games: libm with ECMAScript edge semantics, Mulberry32, hash2, simplex noise"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["js"]
# The JavaScript-semantics helpers (`pk_math::js`), for ports of JS code.
# The kernel and the noise functions use a few of them internally either
# way; the feature only decides whether the module is public API.
js = []

[dependencies]
# Pinned exactly: a different libm version may round differently, and the
# games' recorded goldens were taken with this one.
libm = "=0.2.16"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

# These two test the `js` helpers (the golden covers them too).
[[test]]
name = "js"
required-features = ["js"]

[[test]]
name = "golden"
required-features = ["js"]
