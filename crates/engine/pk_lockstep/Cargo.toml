[package]
name = "pk_lockstep"
description = "The Simulation seam of lockstep games: the trait and its netcode hooks, FNV-1a, named RNG streams, recordings, determinism and fuzz checks, the frame-to-tick arithmetic"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/sequoia-hope/playground-kit"
publish.workspace = true

[dependencies]
# Only for `Mulberry32` and `Rng` (the named streams and the fuzzer). The
# `js` helpers are the games' business.
pk_math = { workspace = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
