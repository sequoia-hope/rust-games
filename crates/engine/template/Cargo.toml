# A game on Playground Kit. The kit is the sibling checkout
# `../game-engine` (its crates by path, its patched wgpu and Bevy crates
# through [patch.crates-io]); CI clones it beside this repository. The
# dependency rules between the crates here are `deps.toml`, enforced by
# `cargo xtask check-deps`.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Playground Kit, by sibling path.
pk_math = { path = "../game-engine/crates/pk_math" }
pk_lockstep = { path = "../game-engine/crates/pk_lockstep" }
pk_canvas = { path = "../game-engine/crates/pk_canvas" }
pk_xtask = { path = "../game-engine/crates/pk_xtask" }
pk_shell = { path = "../game-engine/crates/pk_shell" }
# The CLI that post-processes the wasm must be this exact version;
# `cargo xtask web` checks it.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = "0.3"
# Bevy, pinned exactly, as the kit pins it; moves with the kit.
bevy = { version = "=0.19.1", default-features = false }

# Dev builds: our code fast to compile, dependencies optimised.
[profile.dev.package."*"]
opt-level = 3

# Release web builds: `cargo xtask web --release`, then wasm-opt -Oz.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# xtask's image metric runs over hundreds of screenshots.
[profile.dev.package.xtask]
opt-level = 3

# The same patches the kit applies (its patches/*/PATCHED.md say what
# and why, and docs/ECOSYSTEM.md which upstream PR each waits on).
[patch.crates-io]
wgpu = { path = "../game-engine/patches/wgpu" }
wgpu-hal = { path = "../game-engine/patches/wgpu-hal" }
bevy_ui_render = { path = "../game-engine/patches/bevy_ui_render" }
