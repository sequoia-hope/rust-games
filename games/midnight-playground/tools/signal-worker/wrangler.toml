# The signalling relay as a Cloudflare Worker (DECISIONS D1222; README.md).
name = "mp-signal"
main = "src/index.js"
compatibility_date = "2025-09-01"

# No logs: the relay writes nothing down (D1123), and neither does
# Cloudflare's Workers Logs for it.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed objects, which the free plan offers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# A comma-separated list of origins; pages from anywhere else are turned
# away (unset, any page may use the relay). Native clients send no Origin
# and always get in. This is the owner's GitHub Pages origin, which every
# one of their Pages sites shares (rust-games and the frozen
# midnight-playground site alike: an origin carries no path). Testing
# `?signal=` from the local server needs its tailnet origin added here;
# pages served by mp-host don't use this relay at all.
[vars]
ALLOWED_ORIGINS = "https://sequoia-hope.github.io"
