# Snowboarding: a 1080°-style snowboarding game in Rust + Bevy, for the web
# (wasm, WebGPU or WebGL2) and natively.
#
# Borrowed from the sister project midnight-playground: the workspace shape
# (an engine-free simulation crate, one Bevy client crate, xtask for the web
# build), the pinned Bevy and its lean feature set, and the three patched
# crates under patches/ (each has a PATCHED.md saying what and why).
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sb_sim = { path = "crates/sb_sim" }
sb_radio = { path = "crates/sb_radio" }
sb_music = { path = "crates/sb_music" }
# The same glam Bevy 0.19.1 uses, so the simulation's vectors are Bevy's.
glam = "0.32.1"
# The CLI that post-processes the wasm must be this exact version;
# `cargo xtask web` checks it.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = "0.3"

# Dev builds: our code fast to compile, dependencies optimised.
[profile.dev.package."*"]
opt-level = 3

# Release web builds: `cargo xtask web --release`, then wasm-opt.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# The music worklet runs per sample on the audio thread: speed, not size.
[profile.web-release.package.sb_music]
opt-level = 3

[profile.dev.package.xtask]
opt-level = 3

# The crates every game patches, in Playground Kit (../game-engine/patches/
# */PATCHED.md): wgpu caching the WebGPU device's limits (Bevy asks on
# every draw) and destroying buffers and textures when dropped (else they
# wait for the JS garbage collector), wgpu-hal's GL backend skipping
# redundant binds (WebGL2 call count), and bevy_ui_render skipping empty UI
# draws (a Chrome WebGPU warning).
[patch.crates-io]
wgpu = { path = "../game-engine/patches/wgpu" }
wgpu-hal = { path = "../game-engine/patches/wgpu-hal" }
bevy_ui_render = { path = "../game-engine/patches/bevy_ui_render" }
