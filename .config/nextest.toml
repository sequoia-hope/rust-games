# cargo-nextest: the test runner (`cargo nextest run --workspace`), for the
# whole rust-games workspace (it was Midnight Playground's).
#
# `cargo test` has no timeout, and a test killed from outside leaves its
# binary running: when an agent's command timed out on a test that looped,
# `cargo` died and two `mp_levels` test binaries spun on a core each for four
# days. nextest kills a test that overruns, and kills its tests when it is
# killed itself.
#
# The slowest test takes about 50 s in a debug build with the whole workspace
# running (mp_audio's exhaust_game); a test is flagged at 60 s and killed at
# 5 minutes, room for a busy machine.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# mp_host's http integration tests bind real sockets and time out when the
# machine is loaded during a whole-workspace run (they pass alone): retry
# them, so a busy machine doesn't block scripts/land.sh. A test that fails
# every retry still fails; one that needed a retry is reported as flaky.
[[profile.default.overrides]]
filter = 'package(mp_host) & binary(http)'
retries = 2
